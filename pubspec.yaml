name: dyhanie
description: Эфемерный P2P мессенджер Дыхание
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  image_picker: ^1.1.2
  firebase_core: ^3.6.0
  firebase_database: ^11.1.4
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.2
  url_launcher: ^6.3.0
  uuid: ^4.5.1
  file_picker: ^8.1.2
  path_provider: ^2.1.4
  http: ^1.2.2
  flutter_webrtc: ^0.12.1+hotfix.1
  mobile_scanner: ^5.2.3
  characters: ^1.3.0
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/welcome_logo.png
    - assets/images/welcome_bg.png